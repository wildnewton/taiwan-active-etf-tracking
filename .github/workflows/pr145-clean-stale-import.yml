name: PR 145 clean stale import

on:
  push:
    branches:
      - docs/remove-hardcoded-etf-table-from-agents

permissions:
  contents: write

jobs:
  clean-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/remove-hardcoded-etf-table-from-agents
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Remove stale import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_official_response_contracts.py")
          text = path.read_text(encoding="utf-8")
          old = "import json\nfrom pathlib import Path\nfrom unittest.mock import AsyncMock, Mock, patch\n"
          new = "import json\nfrom unittest.mock import AsyncMock, Mock, patch\n"
          if old not in text:
              raise SystemExit("stale Path import block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git rm .github/workflows/pr145-clean-stale-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_official_response_contracts.py
          git commit -m "test: remove stale Path import"

      - name: Run targeted tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_signal_report.py::test_readme_documents_watchdog_job_without_fixed_schedule \
            tests/test_readme.py \
            tests/test_official_response_contracts.py

      - name: Run full suite
        run: PYTHONPATH=. pytest -q

      - name: Push tested commit
        run: git push origin HEAD:docs/remove-hardcoded-etf-table-from-agents
