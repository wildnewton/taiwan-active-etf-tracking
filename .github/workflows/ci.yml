name: CI

on:
  push:
    branches:
      - main
      - master
      - "milestone-*"
      - "ci-*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  export-test-map:
    name: Export diagnostic test map
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build test map
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name 'test_*.py' | sort)
          : > test-map.txt
          chunk_index=0
          subgroup_one_index=0
          for i in "${!files[@]}"; do
            if (( i % 4 == 2 )); then
              subgroup=$((chunk_index % 4))
              printf 'global=%s chunk_index=%s subgroup=%s' "$i" "$chunk_index" "$subgroup" >> test-map.txt
              if (( subgroup == 1 )); then
                printf ' subgroup_one_index=%s half=%s quarter=%s' \
                  "$subgroup_one_index" \
                  "$((subgroup_one_index % 2))" \
                  "$(((subgroup_one_index / 2) % 2))" >> test-map.txt
                ((subgroup_one_index+=1))
              fi
              printf ' file=%s\n' "${files[$i]}" >> test-map.txt
              ((chunk_index+=1))
            fi
          done
          cat test-map.txt
      - name: Upload test map
        uses: actions/upload-artifact@v4
        with:
          name: pr141-test-map
          path: test-map.txt
