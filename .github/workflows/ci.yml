name: CI

on:
  push:
    branches:
      - main
      - master
      - "milestone-*"
      - "ci-*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  targeted:
    name: PR 141 targeted tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Run targeted tests
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_prelisting_etfs.py
          tests/test_listing_date_pending_review_pipeline.py
          tests/test_nightly_discovery_status.py
          tests/test_nightly_existing_snapshot_completeness.py
          tests/test_nightly_persisted_coverage.py
          tests/test_nightly_pipeline.py
          tests/test_nightly_pipeline_non_trading_day.py
          tests/test_daily_snapshot_replacement.py::test_pipeline_success_path_uses_snapshot_replacement_once_per_etf
