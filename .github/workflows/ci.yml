name: CI

on:
  push:
    branches:
      - main
      - master
      - "milestone-*"
      - "ci-*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  minimal-order-cases:
    name: Minimal order case ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [manager-before-nightly, nightly-before-report]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Run minimal order case
        shell: bash
        env:
          CASE_NAME: ${{ matrix.case }}
        run: |
          if [[ "$CASE_NAME" == "manager-before-nightly" ]]; then
            files=(tests/test_manager_intent_rollups.py tests/test_nightly_persisted_coverage.py)
          else
            files=(tests/test_nightly_persisted_coverage.py tests/test_report_redesign.py)
          fi
          set +e
          PYTHONPATH=. pytest -q "${files[@]}" --junitxml="${CASE_NAME}.xml"
          status=$?
          echo "$status" > "${CASE_NAME}.status"
          exit 0
      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: pr141-${{ matrix.case }}
          path: |
            ${{ matrix.case }}.xml
            ${{ matrix.case }}.status
