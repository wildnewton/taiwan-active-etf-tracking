name: CI

on:
  push:
    branches:
      - main
      - master
      - "milestone-*"
      - "ci-*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run post-152 targeted tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Run tests
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_etf_universe_schema_migration.py
          tests/test_signal_assessment_criteria.py
          tests/test_signal_assessment_fail_closed.py
          tests/test_signal_assessment_cutover.py
          tests/test_report_redesign.py
          tests/test_signal_report.py
          tests/test_signals.py
          tests/test_consensus_freshness.py
