name: CI

on:
  push:
    branches:
      - main
      - master
      - "milestone-*"
      - "ci-*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  chunk-two-pairs:
    name: Chunk 2 pair ${{ matrix.pair }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair: ["0-1", "0-2", "0-3", "1-2", "1-3", "2-3"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Run chunk-2 pair
        shell: bash
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          first=${PAIR%-*}
          second=${PAIR#*-}
          mapfile -t files < <(find tests -maxdepth 1 -name 'test_*.py' | sort)
          selected=()
          chunk_index=0
          for i in "${!files[@]}"; do
            if (( i % 4 == 2 )); then
              subgroup=$((chunk_index % 4))
              if (( subgroup == first || subgroup == second )); then
                selected+=("${files[$i]}")
              fi
              ((chunk_index+=1))
            fi
          done
          printf 'Running %s\n' "${selected[@]}"
          PYTHONPATH=. pytest -q "${selected[@]}"
