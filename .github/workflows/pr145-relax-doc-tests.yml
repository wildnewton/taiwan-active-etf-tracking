name: PR 145 relax documentation tests

on:
  push:
    branches:
      - docs/remove-hardcoded-etf-table-from-agents

permissions:
  contents: write

jobs:
  edit-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/remove-hardcoded-etf-table-from-agents
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Write RED tests
        run: |
          python - <<'PY'
          from pathlib import Path

          signal_path = Path("tests/test_signal_report.py")
          signal_text = signal_path.read_text(encoding="utf-8")
          old_watchdog = '''def test_readme_documents_watchdog_retry_prompt():
              readme = README.read_text(encoding="utf-8")

              assert "21:00" in readme
              assert "scripts/retry_stale_scrapes.py" in readme
              assert '--date "$(date +%F)"' in readme
              assert "target-date holdings gaps" in readme
              assert "overwrite date-only primary reports only after holdings coverage improves" in readme
          '''
          new_watchdog = '''def test_readme_documents_watchdog_job_without_fixed_schedule():
              readme = README.read_text(encoding="utf-8")
              normalized = readme.lower()

              assert "21:00" not in readme
              assert "watchdog" in normalized
              assert "scripts/retry_stale_scrapes.py" in readme
              assert '--date "$(date +%F)"' in readme
              assert "target-date holdings gaps" in normalized
              assert "coverage improves" in normalized
              assert "partial coverage" in normalized
          '''
          if old_watchdog not in signal_text:
              raise SystemExit("watchdog test block not found")
          signal_path.write_text(signal_text.replace(old_watchdog, new_watchdog), encoding="utf-8")

          readme_test_path = Path("tests/test_readme.py")
          readme_test_text = readme_test_path.read_text(encoding="utf-8")
          old_scope = '''def test_readme_documents_taiwan_stock_active_etf_scope():
              text = _readme_text()

              assert (
                  "Taiwan Active ETF Tracking is a Python pipeline for tracking "
                  "Taiwan-listed active ETFs whose investment universe is Taiwan stocks."
              ) in text
          '''
          new_scope = '''def test_readme_documents_taiwan_stock_active_etf_scope():
              text = _readme_text().lower()

              assert "taiwan-listed active etfs" in text
              assert "taiwan stocks" in text
          '''
          if old_scope not in readme_test_text:
              raise SystemExit("README scope test block not found")
          readme_test_text = readme_test_text.replace(old_scope, new_scope)

          old_entrypoints = '''def test_readme_documents_current_entrypoints_and_layout():
              text = _readme_text()

              assert "scripts/nightly-cron.sh" in text
              assert "scripts/nightly_pipeline.py" in text
              assert "scripts/scrapers/" in text
              assert "data/etf_universe_seed.json" not in text
              assert "sole runtime source of truth" in text
          '''
          new_entrypoints = '''def test_readme_documents_current_entrypoints_and_db_configuration():
              text = _readme_text()

              assert "scripts/nightly-cron.sh" in text
              assert "scripts/nightly_pipeline.py" in text
              assert "scripts/scrapers/" in text
              assert "data/etf_universe_seed.json" not in text
              for identifier in (
                  "etf_universe",
                  "official_url",
                  "official_method",
                  "official_logic",
              ):
                  assert identifier in text
          '''
          if old_entrypoints not in readme_test_text:
              raise SystemExit("README entrypoint test block not found")
          readme_test_path.write_text(
              readme_test_text.replace(old_entrypoints, new_entrypoints),
              encoding="utf-8",
          )

          contracts_path = Path("tests/test_official_response_contracts.py")
          contracts_text = contracts_path.read_text(encoding="utf-8")
          redundant_test = '''def test_legacy_listener_mock_adapter_is_removed():
              conftest = Path(__file__).with_name("conftest.py").read_text(encoding="utf-8")
              official_tests = Path(__file__).with_name("test_official.py").read_text(encoding="utf-8")

              assert "adapt_legacy_official_playwright_mocks" not in conftest
              assert "page.on = _on" not in official_tests
              assert "_fire_response_events" not in official_tests
              assert "page.expect_response" in official_tests
          '''
          if redundant_test not in contracts_text:
              raise SystemExit("redundant source-inspection test block not found")
          contracts_path.write_text(
              contracts_text.replace("\n\n" + redundant_test, ""),
              encoding="utf-8",
          )
          PY

          git rm .github/workflows/pr145-relax-doc-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_signal_report.py tests/test_readme.py tests/test_official_response_contracts.py
          git commit -m "test: relax documentation wording assertions"

      - name: Verify RED state
        run: |
          set +e
          PYTHONPATH=. pytest -q \
            tests/test_signal_report.py::test_readme_documents_watchdog_job_without_fixed_schedule \
            tests/test_readme.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED tests to fail before README update"
            exit 1
          fi

      - name: Push RED commit
        run: git push origin HEAD:docs/remove-hardcoded-etf-table-from-agents
